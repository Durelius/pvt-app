name: Deploy Backend Services

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  discover:
    name: Discover Services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.list.outputs.services }}
    steps:
      - uses: actions/checkout@v3

      - name: List services
        id: list
        run: |
          services='[]'
          for dir in backend/services/*/; do
            [ -f "$dir/app/main.go" ] || continue
            name=$(basename "$dir")
            services=$(echo "$services" | jq -c \
              ". + [{\"name\": \"$name\", \"path\": \"backend/services/$name\"}]")
          done
          services=$(echo "$services" | jq -c \
            ". + [{\"name\": \"api-gateway\", \"path\": \"backend/api-gateway\"}]")
          echo "services=$services" >> $GITHUB_OUTPUT

  test-ssh:
    name: Test SSH Connection
    environment: production
    runs-on: ubuntu-latest
    env:
      DEPLOY_IP: ${{ vars.LINODE_IP }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
    steps:
      - name: Add SSH Server to Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan $DEPLOY_IP >> ~/.ssh/known_hosts

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Test RSYNC
        run: |
          sudo apt-get update && sudo apt-get install -y rsync
          echo "foobar" > temp.txt
          rsync -avz \
            -e "ssh -o GSSAPIAuthentication=no -o GSSAPIKeyExchange=no" \
            temp.txt \
            $DEPLOY_USER@$DEPLOY_IP:/var/www/pvt-backend/
          ssh $DEPLOY_USER@$DEPLOY_IP "rm /var/www/pvt-backend/temp.txt"

  build:
    name: Build ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    needs: [discover, test-ssh]
    strategy:
      matrix:
        service: ${{ fromJson(needs.discover.outputs.services) }}
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Test
        run: go test ./...
        working-directory: ${{ matrix.service.path }}

      - name: Build
        run: go build -o ${{ matrix.service.name }}.bin ./app/main.go
        working-directory: ${{ matrix.service.path }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service.name }}-bin
          path: ${{ matrix.service.path }}/${{ matrix.service.name }}.bin

  deploy:
    name: Deploy
    environment: production
    runs-on: ubuntu-latest
    needs: [discover, build]
    env:
      DEPLOY_IP: ${{ vars.LINODE_IP }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          pattern: '*-bin'
          path: bins

      - name: Add SSH Server to Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan $DEPLOY_IP >> ~/.ssh/known_hosts

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Install rsync
        run: sudo apt-get update && sudo apt-get install -y rsync

      - name: Deploy binaries
        run: |
          for dir in bins/*/; do
            name=$(basename "$dir")
            service="${name%-bin}"
            rsync -avz --chmod=+x \
              -e "ssh -o GSSAPIAuthentication=no -o GSSAPIKeyExchange=no" \
              "$dir" \
              $DEPLOY_USER@$DEPLOY_IP:/var/www/pvt-backend/$service/
          done

      - name: Sync systemd services
        env:
          SERVICES: ${{ needs.discover.outputs.services }}
        run: |
          service_names=$(echo "$SERVICES" | jq -r '.[].name')
          while IFS= read -r service; do
            printf '[Unit]\nDescription=PVT %s\nAfter=network.target\n\n[Service]\nType=simple\nUser=%s\nExecStart=/var/www/pvt-backend/%s/%s.bin\nRestart=on-failure\nRestartSec=5\n\n[Install]\nWantedBy=multi-user.target\n' \
              "$service" "$DEPLOY_USER" "$service" "$service" > /tmp/pvt-$service.service
            rsync -avz \
              -e "ssh -o GSSAPIAuthentication=no -o GSSAPIKeyExchange=no -o StrictHostKeyChecking=no" \
              /tmp/pvt-$service.service \
              $DEPLOY_USER@$DEPLOY_IP:/tmp/pvt-$service.service
            ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_IP "
              sudo mv /tmp/pvt-$service.service /etc/systemd/system/pvt-$service.service
              sudo systemctl daemon-reload
              sudo systemctl enable pvt-$service.service
              sudo systemctl restart pvt-$service.service
            "
          done <<< "$service_names"
