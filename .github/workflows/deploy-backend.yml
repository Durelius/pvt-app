name: Deploy Backend Services

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  discover:
    name: Discover Services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.list.outputs.services }}
    steps:
      - uses: actions/checkout@v3

      - name: List services
        id: list
        run: |
          services='[]'
          for dir in backend/services/*/; do
            [ -f "$dir/app/main.go" ] || continue
            name=$(basename "$dir")
            services=$(echo "$services" | jq -c \
              ". + [{\"name\": \"$name\", \"path\": \"backend/services/$name\"}]")
          done
          services=$(echo "$services" | jq -c \
            ". + [{\"name\": \"api-gateway\", \"path\": \"backend/api-gateway\"}]")
          echo "services=$services" >> $GITHUB_OUTPUT

  test-ssh:
    name: Test SSH Connection
    environment: production
    runs-on: ubuntu-latest
    env:
      DEPLOY_IP: ${{ vars.HEXABYTE_IP }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
    steps:
      - name: Add SSH Server to Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan $DEPLOY_IP >> ~/.ssh/known_hosts

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Test RSYNC
        run: |
          sudo apt-get update && sudo apt-get install -y rsync
          echo "foobar" > temp.txt
          rsync -avz \
            -e "ssh -o GSSAPIAuthentication=no -o GSSAPIKeyExchange=no" \
            temp.txt \
            $DEPLOY_USER@$DEPLOY_IP:/srv/www/pvt-production/
          ssh $DEPLOY_USER@$DEPLOY_IP "rm /srv/www/pvt-production/temp.txt"

  build:
    name: Build ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    needs: [discover, test-ssh]
    strategy:
      matrix:
        service: ${{ fromJson(needs.discover.outputs.services) }}
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Test
        run: go test ./...
        working-directory: ${{ matrix.service.path }}

      - name: Build
        run: go build -o ${{ matrix.service.name }}.bin ./app/main.go
        working-directory: ${{ matrix.service.path }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service.name }}-bin
          path: ${{ matrix.service.path }}/${{ matrix.service.name }}.bin

  deploy:
    name: Deploy
    environment: production
    runs-on: ubuntu-latest
    needs: [discover, build]
    env:
      DEPLOY_IP: ${{ vars.HEXABYTE_IP }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          pattern: '*-bin'
          path: bins

      - name: Add SSH Server to Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan $DEPLOY_IP >> ~/.ssh/known_hosts

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Install rsync
        run: sudo apt-get update && sudo apt-get install -y rsync

      - name: Deploy binaries
        run: |
          for dir in bins/*/; do
            service="${$(basename "$dir")%-bin}"
            rsync -avz --chmod=+x \
              -e "ssh -o GSSAPIAuthentication=no -o GSSAPIKeyExchange=no" \
              "$dir" \
              $DEPLOY_USER@$DEPLOY_IP:/srv/www/pvt-production/backend/$service/
          done

      - name: Restart services
        env:
          SERVICES: ${{ needs.discover.outputs.services }}
        run: |
          cmds=$(echo "$SERVICES" | jq -r '.[].name | "sudo systemctl restart pvt-\(.)-production.service"' | tr '\n' ';')
          ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_IP "$cmds"
